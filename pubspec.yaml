name: local_trait_lab
description: Android-first Flutter prototype for modular on-device emotion model comparison.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  file_picker: ^11.0.2
  path: ^1.9.0
  path_provider: ^2.1.3
  image: ^4.5.4
  flutter_onnxruntime: ^1.8.0
  google_mlkit_face_detection: ^0.13.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gemma_tasks/
